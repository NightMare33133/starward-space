server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    max-http-form-post-size: 20MB
    max-swallow-size: 20MB

spring:
  application:
    name: starward-backend
  profiles:
    active: dev

# 全局 Jackson JSON 序列化规范
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

# OpenAPI 3.0 / Swagger 规范配置 (对接 Apifox)
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui/index.html
    enabled: true

# 🌌 星向空间核心业务与安全配置
starward:
  auth:
    admin-token: ${STARWARD_ADMIN_TOKEN:starward-secret-token-2026}


<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/pompom.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STARWARD · starlight の 星向空间</title>
    <meta name="description" content="向星光深处航行，记录每一次思考与探索。NightMare33133 的个人全栈知识空间与数字分身试验田。" />
    <meta name="theme-color" content="#07090e" />
    <link rel="preload" as="image" href="/images/avatar.png" />
    <link rel="preload" as="image" href="/images/pompom.png" />
    <script>
      (function() {
        var saved = localStorage.getItem('starward_theme');
        if (saved === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-pink-400/30 dark:selection:bg-nebula-cyan/30 transition-colors duration-500">
    <div id="app"></div>
